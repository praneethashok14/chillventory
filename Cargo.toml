[package]
name = "chillventory"
version = "0.1.0"
edition = "2021"
description = "PIN-protected PWA for tracking food inventory across fridges and freezers."
license = "MIT"

[[bin]]
name = "chillventory"
path = "src/main.rs"

[dependencies]
axum = { version = "0.7", features = ["macros"] }
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tower = "0.5"
tower-http = { version = "0.6", features = ["set-header"] }
argon2 = "0.5"
rand = "0.8"
rand_core = { version = "0.6", features = ["std"] }
uuid = { version = "1", features = ["v4", "serde"] }
time = { version = "0.3", features = ["serde", "formatting", "parsing", "macros"] }
hex = "0.4"
subtle = "2"
mime_guess = "2"

[dev-dependencies]
tempfile = "3"
reqwest = { version = "0.12", default-features = false, features = ["json", "cookies", "rustls-tls"] }

[profile.dev]
opt-level = 0

[profile.release]
opt-level = 3
lto = "thin"
