name = "stockspace"
main = "src/index.ts"
compatibility_date = "2026-10-01"
compatibility_flags = ["nodejs_compat"]

# D1 database: holds `accounts`, `inventories`, and `item_photos`.
#
# `database_name` deliberately stays "fridgeflow" even after the project
# was renamed to StockSpace — the actual D1 database on Cloudflare is still
# the one created back when the project was called fridgeflow (same
# UUID, same rows). Renaming it would require creating a new D1 database
# and migrating; the data lives safely under the current name.
[[d1_databases]]
binding = "DB"
database_name = "fridgeflow"
database_id = "e003330b-9642-4c64-ae13-f02d2ca819a5"

# KV namespace for server-side sessions.
# Create it once with:
#   wrangler kv:namespace create SESSIONS
# then paste the returned id below.
[[kv_namespaces]]
binding = "SESSIONS"
id = "7a1c5aa51a9043aab3d4d0fe33f4de5a"

# Static app shell. `npm run prepare` copies the frontend from the repo root
# into ./public, which Wrangler then serves at /, /manifest.webmanifest, etc.
#
# `run_worker_first = true` is critical: without it, the assets handler
# intercepts every request before the Worker runs, which means /api/*
# calls return the SPA shell as HTML and the backend is unreachable.
[assets]
directory = "./public"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = true

# Optional: override the Argon2 cost + session TTL at build time if you want.
[vars]
SESSION_TTL_SECONDS = "3600"
# Cloudflare Workers' SubtleCrypto caps PBKDF2 at 100000 iterations.
# Still comfortably above the NIST SP 800-132 floor; combined with
# Cloudflare's platform rate-limiting on /api/auth/* this is adequate
# for a family-scale app with 4-12 digit PINs.
PBKDF2_ITERATIONS = "100000"
